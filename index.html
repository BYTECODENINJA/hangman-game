<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HangMan Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="game-container">
    <h1>HangMan Game</h1>
    <div class="game-status">
        <p id="remaining-guesses">Remaining Guesses: 6</p>
        <p id="category">Category: Animals</p>
        <p id="hints-remaining">Hints Remaining: 3</p>
    </div>

    <div class="hangman-container">
        <svg id="hangman-svg" width="200" height="200" viewBox="0 0 200 200">
            <line x1="20" y1="180" x2="100" y2="180" stroke="#000100" stroke-width="4"/>
            <line x1="60" y1="180" x2="60" y2="20" stroke="#000100" stroke-width="4"/>
            <line x1="60" y1="20" x2="140" y2="20" stroke="#000100" stroke-width="4"/>
            <line x1="140" y1="20" x2="140" y2="40" stroke="#000100" stroke-width="4"/>
            <!_____Head____>
            <circle id="head" cx="140" cy="60" r="20" fill="#000100" style="display: none"/>
            <line id="body" x1="140" y1="80" x2="140" y2="130" stroke="#000100" stroke-width="3" style="display: none"/>
            <!_____Arms____>
            <line id="left-arm" x1="140" y1="100" x2="110" y2="90" stroke="#000100" stroke-width="3" style="display: none"/>
            <line id="right-arm" x1="140" y1="100" x2="170" y2="90" stroke="#000100" stroke-width="3" style="display: none"/>
            <!_____legs____>
            <line id="left-leg" x1="140" y1="130" x2="120" y2="160" stroke="#000100" stroke-width="3" style="display: none"/>
            <line id="right-leg" x1="140" y1="130" x2="160" y2="160" stroke="#000100" stroke-width="3" style="display: none"/>

            <!_____Face(Shown when lost)____>
            <g id="face" style="display: none;">
                <line x1="130" y1="55" x2="135" y2="60" stroke="#333" stroke-width="2"/>
                <line x1="135" y1="55" x2="130" y2="60" stroke="#333" stroke-width="2"/>
                <line x1="145" y1="55" x2="150" y2="60" stroke="#333" stroke-width="2"/>
                <line x1="150" y1="55" x2="145" y2="60" stroke="#333" stroke-width="2"/>
                <path d="M130 70 Q140 80 150 70" stroke="#333" stroke-width="2" fill="transparent"/>
            </g>
        </svg>
    </div>

    <div class="word-display" id="word-display">
    </div>

    <div class="keyboard" id="keyboard">
    </div>

    <div class="game-message" id="game-message"></div>

    <div class="button-container">
        <button id="hint-btn" class="hint-btn">Hint</button>
        <button id="reset-btn" class="reset-btn">
           Reset
        </button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
